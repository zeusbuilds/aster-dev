version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, flutter]
    groups:
      flutter-packages:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    labels: [dependencies, android]

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
      time: "05:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    labels: [dependencies, ios]
