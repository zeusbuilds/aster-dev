# Format and analyze on push/PR. Fails if code is unformatted or has analyzer issues.
name: Dart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify generated sources
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze --fatal-warnings --fatal-infos

      - name: Test
        run: flutter test

      - name: Verify tracker inventory
        run: dart run tool/verify_production_tracker.dart
