# Compile-only platform integration gates. Signing, devices, configured network
# runtime, and funds-bearing behavior remain exact-candidate local gates.
name: Platform compile

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate sources
        run: dart run build_runner build

      - name: Provision pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION=28.2.13676358
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is required}}"
          sdk_manager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          ndk_root="${sdk_root}/ndk/${NDK_VERSION}"
          ndk_compiler="${ndk_root}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          ndk_is_usable() {
            [[ -f "${ndk_root}/source.properties" && -x "${ndk_compiler}" ]] || return 1
            local installed
            installed="$(sed -n 's/^Pkg.Revision[[:space:]]*=[[:space:]]*//p' "${ndk_root}/source.properties" | tr -d '\r')"
            [[ "${installed}" == "${NDK_VERSION}" ]] || return 1
            "${ndk_compiler}" --version >/dev/null 2>&1
          }
          if ndk_is_usable; then
            echo "Pinned NDK ${NDK_VERSION} is already usable."
            exit 0
          fi
          [[ -x "${sdk_manager}" ]] || { echo "Installed sdkmanager is unavailable." >&2; exit 1; }
          for attempt in 1 2 3; do
            echo "Provision pinned NDK ${NDK_VERSION}, attempt ${attempt}/3."
            if "${sdk_manager}" --install "ndk;${NDK_VERSION}" --channel=0 && ndk_is_usable; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then sleep "$((attempt * 5))"; fi
          done
          echo "Pinned NDK ${NDK_VERSION} could not be provisioned and verified." >&2
          exit 1

      - name: Compile Android host integration
        run: flutter build apk --debug --no-pub

      - name: Run Android host tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Release transient Android build outputs
        if: always()
        run: flutter clean

  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 reviewed 2026-08-19
        with:
          ruby-version: "3.4.10"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Install exact Bundler
        run: gem install bundler --version 4.0.10 --no-document

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate sources
        run: dart run build_runner build

      - name: Resolve locked CocoaPods dependencies
        env:
          BUNDLE_FROZEN: "true"
          BUNDLE_PATH: ${{ github.workspace }}/.bundle
        run: bundle install --jobs 4 --retry 3

      - name: Compile iOS host integration
        env:
          BUNDLE_FROZEN: "true"
          BUNDLE_PATH: ${{ github.workspace }}/.bundle
        run: bundle exec flutter build ios --simulator --debug --no-pub
