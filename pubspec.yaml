name: aster
description: UTEXO Bitcoin, RGB, and Lightning wallet

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  # Flutter 3.44.9 pins meta/test_api below the Riverpod 3.4 toolchain's
  # requirements. This is the newest compatible stable Riverpod release set.
  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3

  # Networking
  http: ^1.6.0

  # Wallet SDK. Keep this immutable; see docs/architecture/SDK_INTEGRATION.md.
  rgb_sdk_flutter:
    git:
      url: https://github.com/UTEXO-Protocol/flutter-sdk.git
      ref: 3dd82e23d80bb4bb6a2d2526c6c6741ac1ea1236

  # Storage
  # 11.0.0 requires Android compile SDK 37, ahead of Flutter 3.44.9's SDK 36.
  flutter_secure_storage: 10.3.1
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

  # Routing
  go_router: ^17.4.0

  # Utilities
  # Small, pure-Dart codecs used by the app-owned Bitcoin destination parser.
  bs58check: 1.0.2
  collection: ^1.19.1
  crypto: ^3.0.7
  dart_bech32: 2.0.0
  # Flutter 3.44.9 pins intl 0.20.2 through flutter_localizations.
  intl: ^0.20.2

  # Icons
  # Flutter's Cupertino framework paths require this font during release
  # icon tree-shaking even though feature code uses the app icon libraries.
  cupertino_icons: ^1.0.9
  remixicon: ^4.9.3
  unicons: ^3.0.0

  # Camera & barcode scanning
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.0

  # Core
  circle_flags: ^5.0.1
  easy_radio: ^0.0.3
  flutter_svg: ^2.3.0
  haptic_feedback: ^0.6.5
  mesh: ^0.5.0
  ming_cute_icons: ^0.0.8
  pretty_qr_code: ^3.6.0
  smooth_page_indicator: ^2.0.1
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: 2.15.1
  riverpod_generator: 4.0.4

  # Testing
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/icons/images/
    - assets/icons/tokens/
    - assets/brand/
    - assets/texture/
    - assets/data/

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
        - asset: assets/fonts/DMSans-Italic-Variable.ttf
          style: italic
    - family: Public Sans
      fonts:
        - asset: assets/fonts/PublicSans-Variable.ttf
        - asset: assets/fonts/PublicSans-Italic-Variable.ttf
          style: italic
