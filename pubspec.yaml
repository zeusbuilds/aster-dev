name: aster
description: Aster Bitcoin, RGB, and Lightning wallet powered by UTEXO

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  # Keep the Riverpod runtime and generated annotations on one reviewed set.
  flutter_riverpod: 3.4.2
  riverpod_annotation: 4.0.6

  # Networking
  http: ^1.6.0

  # Wallet SDK. Keep this immutable; see docs/architecture/SDK_INTEGRATION.md.
  rgb_sdk_flutter:
    git:
      url: https://github.com/UTEXO-Protocol/flutter-sdk.git
      ref: 3dd82e23d80bb4bb6a2d2526c6c6741ac1ea1236

  # Storage
  # 11.0.0 requires Android compile SDK 37, ahead of Flutter 3.47.0's SDK 36.
  flutter_secure_storage: 10.3.1
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

  # Routing
  go_router: ^17.5.0

  # Utilities
  # Small, pure-Dart codecs used by the app-owned Bitcoin destination parser.
  bs58check: 1.0.2
  collection: ^1.19.1
  crypto: ^3.0.7
  dart_bech32: 2.0.0
  intl: ^0.20.3

  # Icons
  # Flutter's Cupertino framework paths require this font during release
  # icon tree-shaking even though feature code uses the app icon libraries.
  cupertino_icons: ^1.0.9
  remixicon: ^4.9.3
  unicons: ^3.0.0

  # Camera & barcode scanning
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.0

  # Core
  circle_flags: ^5.0.1
  flutter_svg: ^2.3.0
  haptic_feedback: ^0.6.5
  mesh: ^0.5.0
  ming_cute_icons: ^0.0.8
  pretty_qr_code: ^3.6.0
  smooth_page_indicator: ^2.0.1
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation and repository policy tooling.
  analyzer: 13.3.0
  build_runner: 2.16.0
  riverpod_generator: 4.0.8
  xml: 7.0.1
  yaml: 3.1.3

  # Testing
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/brand/aster-mark.svg
    - assets/data/bip39_english.txt
    - assets/data/countries.json
    - assets/data/currencies.json
    - assets/icons/tokens/btc.svg
    - assets/icons/tokens/usdt.svg
    - assets/texture/noise.jpg
    - assets/texture/shape.png

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
        - asset: assets/fonts/DMSans-Italic-Variable.ttf
          style: italic
    - family: Public Sans
      fonts:
        - asset: assets/fonts/PublicSans-Variable.ttf
        - asset: assets/fonts/PublicSans-Italic-Variable.ttf
          style: italic
