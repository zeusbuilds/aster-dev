name: aster
description: Aster - Bitcoin & Layer 2 Wallet

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ^3.22.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.1

  # Networking
  chopper: ^7.4.0
  connectivity_plus: ^6.1.2
  http: ^1.5.0

  # Storage
  flutter_secure_storage: ^9.0.0
  objectbox: ^4.1.0
  objectbox_flutter_libs: ^4.1.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.0

  # Crypto utilities for wallet ID generation
  crypto: ^3.0.3

  # Routing
  go_router: ^14.2.7

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Utilities
  async: ^2.11.0
  collection: ^1.17.1
  dartz: ^0.10.1
  intl: any
  nanoid: ^1.0.0

  # Theming
  google_fonts: ^6.3.3

  # Icons
  cupertino_icons: ^1.0.8
  fl_chart: ^1.1.1
  remixicon: ^1.4.1
  unicons: ^3.0.0

  # Camera & barcode scanning
  camera: ^0.11.0+2
  google_mlkit_barcode_scanning: ^0.14.0
  image_picker: ^1.0.7

  # Core
  circle_flags: ^5.0.1
  country_flags: ^4.1.1
  crypto_icons: ^1.0.0
  custom_numeric_pad: ^0.0.5
  easy_radio: ^0.0.3
  flag: ^7.0.2
  flutter_svg: ^2.2.3
  gdk_flutter:
    path: /Users/hardik/Projects/Jan3/gdk_flutter
  haptic_feedback: ^0.6.4+2
  mesh: ^0.5.0
  mesh_gradient: ^1.3.8
  ming_cute_icons: ^0.0.7
  pretty_qr_code: ^3.5.0
  rename_app: ^1.6.5
  skeletonizer: ^2.1.2
  flutter_native_splash: ^2.4.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  import_sorter: ^4.6.0

  # Code Generation
  build_runner: ^2.4.6
  chopper_generator: ^7.4.0
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  objectbox_generator: ^4.1.0
  riverpod_generator: ^2.1.1

  # Testing
  mocktail: ^1.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/icons/images/
    - assets/icons/tokens/
    - assets/brand/
    - assets/texture/
    - assets/data/